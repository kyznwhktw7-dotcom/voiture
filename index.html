<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Voitures</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .cars-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
    .car-card{padding:12px;border-radius:8px;background:#fff;border:1px solid #e6e9ef}
    .car-card h3{margin:0 0 6px;font-size:1.05rem}
    .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
    .topbar a{font-size:.95rem;color:var(--accent);text-decoration:none}
    #search{padding:8px;border-radius:8px;border:1px solid #e6e9ef}
  </style>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <h1>Voitures</h1>
      <div>
        <input id="search" placeholder="Rechercher...">
        <a href="todo.html">Voir To‑Do</a>
      </div>
    </div>

    <p id="count" class="hint">Chargement...</p>
    <div id="cars" class="cars-grid" aria-live="polite"></div>
  </div>

  <script src="cars.js"></script>
</body>
</html>
